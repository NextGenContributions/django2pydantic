version: "0.1"
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: main-ng
      uri: https://github.com/NextGenContributions/plugins
runtimes:
  enabled:
    - python@>=3.10.8
    - go@>=1.21.0
    - node@>=18.20.5
  definitions:
    - type: python
      system_version: allowed
lint:
  definitions:
    - name: mypy
      commands:
        - name: lint
          run: mypy --no-incremental --ignore-missing-imports --follow-imports=silent --show-error-codes --show-column-numbers ${target}
  enabled:
    - actionlint@1.7.12
    - bandit@1.9.4
    - checkov@3.3.16
    - codespell@2.4.3
    # Temporarily disabled until we have better solution for unknown words
    # - cspell@8.17.5
    - djlint@1.45.0
    - flake8
    - git-diff-check
    - gitleaks@8.30.1
    - hadolint@2.15.1
    - markdown-link-check@3.15.0
    - markdown-table-prettify@4.1.0
    - markdownlint-cli2@0.23.2
    - mypy
    - osv-scanner@2.5.1
    - prettier@3.9.6
    - pylint
    - pyright
    - basedpyright
    - renovate@44.61.6
    - ruff
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - taplo@0.10.0
    - trivy@0.74.0
    - trufflehog@3.97.4
    - vale@3.20.0
    - yamllint@1.38.0
  ignore:
    - linters:
        - ALL
      paths:
        - "*.egg"
        - "*.egg-info/**"
        - .eggs/**
        - .git/**
        - .tox/**
        - .venv/**
        - __pycache__/**
        - bin/**
        - build/**
        - dist/**
        - test_*.py
        - tests/**
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
